services:
  - type: web
    name: devflow12
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEVFLOW_OWNER_MODE
        value: "1"
      - key: DEVFLOW_PUBLIC_ACCESS
        value: "1"
