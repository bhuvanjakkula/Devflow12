pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    log_format safe '$request_method $status $request_time';
    access_log /dev/stdout safe;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    client_max_body_size 8m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 10s;
    server {
        listen 8443 ssl default_server;
        server_name devflow.example.com;
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        if ($host != devflow.example.com) { return 444; }
        location / {
            limit_req zone=per_ip burst=20 nodelay;
            limit_req_status 429;
            limit_conn connections 10;
            proxy_pass http://devflow:8000;
            proxy_set_header Host devflow.example.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            proxy_request_buffering on;
        }
    }
}
